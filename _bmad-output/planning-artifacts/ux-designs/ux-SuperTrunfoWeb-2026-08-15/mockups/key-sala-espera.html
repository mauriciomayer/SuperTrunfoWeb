<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mock — Sala de Espera (v2 pop-art)</title>
<style>
/* Governed by: EXPERIENCE.md > Padrões de Componente ("Lista da Sala de Espera"), Padrões de Estado
   DESIGN.md > Componentes (Lista da Sala de Espera, pill-ia) */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #ddd; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; display: flex; justify-content: center; padding: 32px 16px; }
.phone {
  width: 375px; min-height: 720px;
  background-color: #F5C518;
  background-image: linear-gradient(#FBE07A 1px, transparent 1px), linear-gradient(90deg, #FBE07A 1px, transparent 1px);
  background-size: 20px 20px;
  border-radius: 28px; border: 8px solid #111; overflow: hidden;
  box-shadow: 0 20px 40px rgba(0,0,0,.3); display: flex; flex-direction: column;
}
.statusbar { height: 24px; background: rgba(0,0,0,.08); }
.content { flex: 1; padding: 26px 22px; display: flex; flex-direction: column; gap: 16px; }
h1 { font-weight: 900; font-size: 20px; color: #1E1712; text-align: center; }
.sub { color: #1E1712; opacity: .75; text-align: center; font-size: 13px; margin-top: -8px; font-weight:600; }
.list { background: #FFFFFF; border-radius: 14px; overflow: hidden; border: 3px solid #D62828; }
.row { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #E8DFC0; min-height: 44px; }
.row:last-child { border-bottom: none; }
.name { font-size: 15px; color: #1E1712; font-weight:600; }
.name.host::after { content: " (host)"; color: #5B5342; font-size: 12px; font-weight:400; }
.pill-ia { background: #1E1712; color: #FFFFFF; font-size: 11px; font-weight: 900; letter-spacing: .04em; padding: 4px 10px; border-radius: 9999px; }
.pill-humano { background: #F0961D; color: #1E1712; font-size: 11px; font-weight: 900; letter-spacing: .04em; padding: 4px 10px; border-radius: 9999px; }
.btn-primary { min-height: 44px; background: #D62828; color: #FFFFFF; border: none; border-radius: 6px; font-size: 16px; font-weight: 900; cursor: pointer; margin-top: 6px; }
.link-box { background: #FFFFFF; color: #1E1712; font-size: 12px; padding: 12px; border-radius: 8px; word-break: break-all; font-weight:600; border: 1px solid #E8DFC0; }
</style>
</head>
<body>
  <div class="phone">
    <div class="statusbar"></div>
    <div class="content">
      <h1>Sala de Espera</h1>
      <div class="sub">Aguardando 3 de 4 jogadores…</div>
      <div class="link-box">supertrunfo.web/sala/8k2f — envie esse link pros convidados</div>
      <div class="list">
        <div class="row"><span class="name host">Mauricio</span><span class="pill-humano">Você</span></div>
        <div class="row"><span class="name">Mãe</span><span class="pill-humano">Entrou</span></div>
        <div class="row"><span class="name">Pai</span><span class="pill-humano">Entrou</span></div>
        <div class="row"><span class="name" style="color:#5B5342;font-weight:400;">Aguardando…</span></div>
      </div>
      <button class="btn-primary">Iniciar</button>
    </div>
  </div>
</body>
</html>
